<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Fashion Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#f57224;
    --orange-dark:#d95d12;
    --dark:#111827;
    --text:#333;
    --muted:#777;
    --border:#e5e7eb;
    --bg:#f5f5f5;
    --red:#ef4444;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button{
    font-family:inherit;
}

.header{
    background:var(--orange);
    color:#fff;
    padding:15px 0;
}

.header-inner{
    width:min(1200px,94%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:800;
    cursor:pointer;
}

.back-btn{
    background:#fff;
    color:var(--orange);
    border:0;
    padding:9px 15px;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:min(1200px,94%);
    margin:25px auto;
}

.title{
    font-size:25px;
    font-weight:700;
    margin-bottom:20px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 350px;
    gap:20px;
}

.cart-box,
.summary{
    background:#fff;
    border-radius:8px;
    padding:20px;
}

.cart-item{
    display:grid;
    grid-template-columns:100px 1fr auto;
    gap:15px;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.cart-item:first-child{
    padding-top:0;
}

.cart-item:last-child{
    border-bottom:0;
}

.cart-image{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:6px;
    background:#eee;
}

.item-name{
    font-size:17px;
    font-weight:700;
    margin-bottom:7px;
}

.item-info{
    font-size:13px;
    color:var(--muted);
    margin-bottom:5px;
}

.item-price{
    color:var(--orange);
    font-size:17px;
    font-weight:700;
}

.qty-box{
    display:flex;
    align-items:center;
    margin-top:12px;
}

.qty-btn{
    width:32px;
    height:32px;
    border:1px solid #ddd;
    background:#fff;
    cursor:pointer;
    font-size:18px;
}

.qty-btn:hover{
    background:#f5f5f5;
}

.qty-number{
    width:40px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;
}

.remove-btn{
    border:0;
    background:#fff;
    color:var(--red);
    font-size:13px;
    cursor:pointer;
    margin-top:8px;
}

.remove-btn:hover{
    text-decoration:underline;
}

.item-total{
    font-size:17px;
    font-weight:bold;
    text-align:right;
    white-space:nowrap;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.shop-btn{
    display:inline-block;
    margin-top:20px;
    background:var(--orange);
    color:#fff;
    padding:12px 25px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
}

.shop-btn:hover{
    background:var(--orange-dark);
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.error{
    text-align:center;
    padding:50px 20px;
    color:#b91c1c;
}

.summary{
    height:max-content;
}

.summary h2{
    font-size:20px;
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-size:14px;
}

.summary-row.total{
    border-top:1px solid #eee;
    padding-top:18px;
    font-size:20px;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    background:var(--orange);
    color:#fff;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.checkout-btn:hover{
    background:var(--orange-dark);
}

.checkout-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.delivery-note{
    background:#fff7f2;
    color:#a44b1b;
    padding:12px;
    border-radius:5px;
    font-size:12px;
    margin-top:15px;
    line-height:1.6;
}

@media(max-width:800px){

    .layout{
        grid-template-columns:1fr;
    }

    .summary{
        order:-1;
    }

}

@media(max-width:550px){

    .container{
        width:94%;
    }

    .cart-item{
        grid-template-columns:75px 1fr;
        gap:12px;
    }

    .cart-image{
        width:75px;
        height:75px;
    }

    .item-total{
        grid-column:2;
        text-align:left;
    }

    .item-name{
        font-size:15px;
    }

    .item-price{
        font-size:15px;
    }

    .header-inner{
        flex-direction:column;
        align-items:stretch;
    }

    .back-btn{
        width:100%;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div
            class="logo"
            onclick="location.href='index.html'"
        >
            Fashion Gallery
        </div>

        <button
            class="back-btn"
            onclick="location.href='index.html'"
        >
            ← Continue Shopping
        </button>

    </div>

</header>


<div class="container">

    <div class="title">
        Shopping Cart 🛒
    </div>


    <div class="layout">

        <div class="cart-box">

            <div id="cartItems">

                <div class="loading">
                    Loading cart...
                </div>

            </div>

        </div>


        <div class="summary">

            <h2>
                Order Summary
            </h2>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong>
                    ৳<span id="subtotal">0</span>
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong>
                    ৳<span id="delivery">0</span>
                </strong>

            </div>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span>
                    ৳<span id="total">0</span>
                </span>

            </div>


            <button
                class="checkout-btn"
                id="checkoutButton"
                onclick="goCheckout()"
                disabled
            >
                Proceed to Checkout
            </button>


            <div class="delivery-note">

                🚚 Delivery charge is currently
                <strong>৳60</strong>.

                Final delivery charge can be changed later
                from the admin system.

            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://xqcvylogmlqykdmzjjpy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_W6xGLr22hXDyWfR7EdKbYw_O5qZ9dJh";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   DELIVERY
========================= */

const DELIVERY_CHARGE = 60;


/* =========================
   CART KEY
   SAME AS index.html
   SAME AS product.html
========================= */

const CART_KEY = "fg_cart";


/* =========================
   CART
========================= */

let cart = [];


/* =========================
   GET CART
========================= */

function getCart(){

    try{

        const saved =
            localStorage.getItem(CART_KEY);

        if(!saved){
            return [];
        }

        const parsed =
            JSON.parse(saved);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(
            "Cart read error:",
            error
        );

        return [];

    }

}


/* =========================
   SAVE CART
========================= */

function saveCart(){

    localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
    );

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadCart(){

    cart = getCart();

    const container =
        document.getElementById("cartItems");

    if(!cart.length){

        renderEmptyCart();

        return;

    }


    /*
       Product Details page stores only:

       id
       quantity
       size
       color

       So here we get the real product
       information from Supabase.
    */

    const ids =
        cart
        .map(item => Number(item.id))
        .filter(id => !isNaN(id));


    if(!ids.length){

        cart = [];

        saveCart();

        renderEmptyCart();

        return;

    }


    container.innerHTML = `

        <div class="loading">
            Loading products...
        </div>

    `;


    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*")
        .in("id",ids);


    if(error){

        console.error(
            "Supabase cart error:",
            error
        );

        container.innerHTML = `

            <div class="error">

                <h2>
                    Unable to load cart
                </h2>

                <p style="margin-top:10px;color:#777;">
                    Please refresh the page and try again.
                </p>

            </div>

        `;

        return;

    }


    const products =
        data || [];


    /*
       Attach product information
       to every cart item.
    */

    const validCart = [];


    cart.forEach(item => {

        const product =
            products.find(
                p =>
                Number(p.id) === Number(item.id)
            );


        if(product){

            validCart.push({

                id:product.id,

                quantity:
                    Math.max(
                        1,
                        Number(item.quantity || 1)
                    ),

                size:
                    item.size || "",

                color:
                    item.color || "",

                name:
                    product.name || "Product",

                price:
                    Number(product.price || 0),

                image_url:
                    product.image_url || "",

                stock:
                    Number(product.stock || 0)

            });

        }

    });


    cart = validCart;

    saveCart();

    renderCart();

}


/* =========================
   EMPTY CART
========================= */

function renderEmptyCart(){

    document.getElementById(
        "cartItems"
    ).innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🛒
            </div>

            <h2>
                Your cart is empty
            </h2>

            <p style="margin-top:8px;">
                Add some products to your cart.
            </p>

            <a
                href="index.html"
                class="shop-btn"
            >
                Start Shopping
            </a>

        </div>

    `;


    document.getElementById(
        "subtotal"
    ).textContent = "0";


    document.getElementById(
        "delivery"
    ).textContent = "0";


    document.getElementById(
        "total"
    ).textContent = "0";


    document.getElementById(
        "checkoutButton"
    ).disabled = true;

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

    const container =
        document.getElementById(
            "cartItems"
        );


    if(!cart.length){

        renderEmptyCart();

        return;

    }


    let subtotal = 0;


    container.innerHTML =
        cart
        .map((item,index)=>{

            const price =
                Number(item.price || 0);

            const quantity =
                Math.max(
                    1,
                    Number(item.quantity || 1)
                );

            const itemTotal =
                price * quantity;

            subtotal += itemTotal;


            const image =
                item.image_url ||
                "https://placehold.co/100x100?text=Product";


            return `

                <div class="cart-item">

                    <img
                        class="cart-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(item.name)}"
                        onerror="
                            this.onerror=null;
                            this.src='https://placehold.co/100x100?text=Product';
                        "
                    >


                    <div>

                        <div class="item-name">

                            ${escapeHtml(
                                item.name ||
                                "Product"
                            )}

                        </div>


                        ${
                            item.size
                            ?
                            `
                            <div class="item-info">
                                Size:
                                ${escapeHtml(item.size)}
                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            item.color
                            ?
                            `
                            <div class="item-info">
                                Color:
                                ${escapeHtml(item.color)}
                            </div>
                            `
                            :
                            ""
                        }


                        <div class="item-price">

                            ৳${price.toLocaleString()}

                        </div>


                        <div class="qty-box">

                            <button
                                class="qty-btn"
                                onclick="changeQty(${index},-1)"
                            >
                                −
                            </button>


                            <div class="qty-number">

                                ${quantity}

                            </div>


                            <button
                                class="qty-btn"
                                onclick="changeQty(${index},1)"
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})"
                        >
                            🗑 Remove
                        </button>

                    </div>


                    <div class="item-total">

                        ৳${itemTotal.toLocaleString()}

                    </div>

                </div>

            `;

        })
        .join("");


    const delivery =
        DELIVERY_CHARGE;


    const total =
        subtotal + delivery;


    document.getElementById(
        "subtotal"
    ).textContent =
        subtotal.toLocaleString();


    document.getElementById(
        "delivery"
    ).textContent =
        delivery.toLocaleString();


    document.getElementById(
        "total"
    ).textContent =
        total.toLocaleString();


    document.getElementById(
        "checkoutButton"
    ).disabled = false;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(index,change){

    if(!cart[index]){
        return;
    }


    const current =
        Number(
            cart[index].quantity || 1
        );


    let newQty =
        current + change;


    if(newQty < 1){

        newQty = 1;

    }


    /*
       Respect product stock
       when stock is available.
    */

    const stock =
        Number(
            cart[index].stock || 0
        );


    if(
        stock > 0 &&
        newQty > stock
    ){

        newQty = stock;

        alert(
            `Only ${stock} item(s) available in stock.`
        );

    }


    cart[index].quantity =
        newQty;


    saveCart();

    renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

    if(!cart[index]){
        return;
    }


    const name =
        cart[index].name ||
        "this product";


    const confirmRemove =
        confirm(
            `Remove "${name}" from your cart?`
        );


    if(!confirmRemove){
        return;
    }


    cart.splice(index,1);

    saveCart();

    renderCart();

}


/* =========================
   CHECKOUT
========================= */

function goCheckout(){

    if(!cart.length){

        alert(
            "Your cart is empty."
        );

        return;

    }


    /*
       Make sure latest cart is saved
       before opening checkout.
    */

    saveCart();


    window.location.href =
        "checkout.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{
        loadCart();
    }
);

</script>

</body>
</html>
