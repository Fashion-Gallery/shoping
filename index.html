<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   FASHION GALLERY - MAIN STORE SYSTEM
===================================================== */


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://xqcvylogmlqykdmzjjpy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_W6xGLr22hXDyWfR7EdKbYw_O5qZ9dJh";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   VARIABLES
========================= */

let allProducts = [];

let currentCategory = "All";


/* =========================
   CART
========================= */

let cart = getCart();


/* =========================
   WISHLIST
========================= */

let wishlist = getWishlist();


/* =====================================================
   LOCAL STORAGE - CART
===================================================== */

function getCart(){

    try{

        /*
           New cart system
        */

        const newCart =
            localStorage.getItem("cart");

        if(newCart){

            const parsed =
                JSON.parse(newCart);

            if(Array.isArray(parsed)){
                return parsed;
            }

        }


        /*
           Old cart system migration
        */

        const oldCart =
            localStorage.getItem("fg_cart");

        if(oldCart){

            const parsed =
                JSON.parse(oldCart);

            if(Array.isArray(parsed)){

                localStorage.setItem(
                    "cart",
                    JSON.stringify(parsed)
                );

                return parsed;

            }

        }

    }catch(error){

        console.error(
            "Cart loading error:",
            error
        );

    }

    return [];

}


/* =========================
   SAVE CART
========================= */

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =====================================================
   WISHLIST STORAGE
===================================================== */

function getWishlist(){

    try{

        const saved =
            localStorage.getItem("fg_wishlist");

        const parsed =
            JSON.parse(saved || "[]");

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        return [];

    }

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        updateCounts();

        loadProducts();


        const search =
            document.getElementById(
                "searchInput"
            );


        if(search){

            search.addEventListener(
                "keydown",
                function(event){

                    if(event.key === "Enter"){

                        searchProducts();

                    }

                }
            );

        }

    }
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const productsGrid =
        document.getElementById(
            "productsGrid"
        );

    const flashGrid =
        document.getElementById(
            "flashProducts"
        );


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allProducts =
            data || [];


        renderProducts(
            allProducts
        );


        renderFlashSale(
            allProducts
        );


    }catch(error){

        console.error(
            "Product loading error:",
            error
        );


        if(productsGrid){

            productsGrid.innerHTML = `
                <div class="empty">
                    Unable to load products.
                    <br>
                    <small>
                        ${escapeHtml(
                            error.message || ""
                        )}
                    </small>
                </div>
            `;

        }


        if(flashGrid){

            flashGrid.innerHTML = `
                <div class="empty">
                    Unable to load products.
                </div>
            `;

        }

    }

}


/* =====================================================
   PRODUCT CARD
===================================================== */

function productCard(product){

    const id =
        product.id;

    const price =
        Number(
            product.price || 0
        );

    const oldPrice =
        Number(
            product.old_price || 0
        );

    const discount =
        Number(
            product.discount || 0
        );

    const rating =
        Number(
            product.rating || 0
        );

    const sold =
        Number(
            product.sold || 0
        );


    const image =
        product.image_url ||
        "https://placehold.co/600x600?text=Fashion+Gallery";


    const liked =
        wishlist.includes(id);


    return `

        <article
            class="product"
            onclick="openProduct(${id})"
        >

            <div class="product-img">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(
                        product.name ||
                        "Product"
                    )}"
                    loading="lazy"
                    onerror="
                        this.src='https://placehold.co/600x600?text=Product'
                    "
                >


                ${
                    discount > 0
                    ?
                    `
                    <div class="discount">
                        -${discount}%
                    </div>
                    `
                    :
                    ""
                }


                <button
                    class="heart"
                    onclick="
                        toggleWishlist(
                            event,
                            ${id}
                        )
                    "
                    aria-label="Wishlist"
                >
                    ${
                        liked
                        ? "♥"
                        : "♡"
                    }
                </button>

            </div>


            <div class="product-info">

                <div class="product-name">

                    ${escapeHtml(
                        product.name ||
                        "Unnamed Product"
                    )}

                </div>


                <div class="price-row">

                    <span class="price">

                        ৳${price.toLocaleString()}

                    </span>


                    ${
                        oldPrice > price
                        ?
                        `
                        <span class="old-price">

                            ৳${oldPrice.toLocaleString()}

                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <div class="rating">

                    ${ratingStars(rating)}

                    <span class="sold">

                        ${sold} sold

                    </span>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(products){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    if(!grid){

        return;

    }


    if(!products.length){

        grid.innerHTML = `
            <div class="empty">
                No products found.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        products
            .map(productCard)
            .join("");

}


/* =====================================================
   FLASH SALE
===================================================== */

function renderFlashSale(products){

    const grid =
        document.getElementById(
            "flashProducts"
        );


    if(!grid){

        return;

    }


    const saleProducts =
        products
            .filter(
                product =>
                    Number(
                        product.discount || 0
                    ) > 0
            )
            .slice(0,5);


    if(saleProducts.length){

        grid.innerHTML =
            saleProducts
                .map(productCard)
                .join("");

        return;

    }


    const normalProducts =
        products.slice(0,5);


    if(!normalProducts.length){

        grid.innerHTML = `
            <div class="empty">
                No products available yet.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        normalProducts
            .map(productCard)
            .join("");

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function filterCategory(
    category,
    button
){

    currentCategory =
        category;


    let filtered;


    if(category === "All"){

        filtered =
            allProducts;

    }else{

        filtered =
            allProducts.filter(
                product =>
                    String(
                        product.category || ""
                    )
                    .toLowerCase()
                    .includes(
                        category.toLowerCase()
                    )
            );

    }


    const title =
        document.getElementById(
            "productTitle"
        );


    if(title){

        title.textContent =
            category === "All"
            ? "Just For You"
            : category;

    }


    renderProducts(
        filtered
    );


    document
        .querySelectorAll(".filter")
        .forEach(
            element =>
                element.classList
                    .remove("active")
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    const productsSection =
        document.getElementById(
            "products"
        );


    if(productsSection){

        productsSection.scrollIntoView({
            behavior:"smooth"
        });

    }

}


/* =====================================================
   SEARCH
===================================================== */

function searchProducts(){

    const input =
        document.getElementById(
            "searchInput"
        );


    if(!input){

        return;

    }


    const query =
        input.value
            .trim()
            .toLowerCase();


    if(!query){

        resetProducts();

        return;

    }


    const filtered =
        allProducts.filter(
            product => {

                const name =
                    String(
                        product.name || ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        product.description || ""
                    )
                    .toLowerCase();


                const category =
                    String(
                        product.category || ""
                    )
                    .toLowerCase();


                return (
                    name.includes(query) ||
                    description.includes(query) ||
                    category.includes(query)
                );

            }
        );


    const title =
        document.getElementById(
            "productTitle"
        );


    if(title){

        title.textContent =
            `Search results for "${query}"`;

    }


    renderProducts(
        filtered
    );


    const productsSection =
        document.getElementById(
            "products"
        );


    if(productsSection){

        productsSection.scrollIntoView({
            behavior:"smooth"
        });

    }

}


/* =====================================================
   RESET PRODUCTS
===================================================== */

function resetProducts(){

    const search =
        document.getElementById(
            "searchInput"
        );


    if(search){

        search.value = "";

    }


    currentCategory =
        "All";


    const title =
        document.getElementById(
            "productTitle"
        );


    if(title){

        title.textContent =
            "Just For You";

    }


    renderProducts(
        allProducts
    );


    document
        .querySelectorAll(".filter")
        .forEach(
            element =>
                element.classList
                    .remove("active")
        );


    const allButton =
        document.querySelector(
            ".filter"
        );


    if(allButton){

        allButton.classList.add(
            "active"
        );

    }

}


/* =====================================================
   PRODUCT DETAILS
===================================================== */

function openProduct(id){

    window.location.href =
        "product.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   WISHLIST
===================================================== */

function toggleWishlist(
    event,
    id
){

    if(event){

        event.stopPropagation();

    }


    if(wishlist.includes(id)){

        wishlist =
            wishlist.filter(
                item =>
                    item !== id
            );

    }else{

        wishlist.push(id);

    }


    localStorage.setItem(
        "fg_wishlist",
        JSON.stringify(
            wishlist
        )
    );


    updateCounts();


    let products =
        allProducts;


    if(currentCategory !== "All"){

        products =
            allProducts.filter(
                product =>
                    String(
                        product.category || ""
                    )
                    .toLowerCase()
                    .includes(
                        currentCategory.toLowerCase()
                    )
            );

    }


    renderProducts(
        products
    );

}


/* =====================================================
   SHOW WISHLIST
===================================================== */

function showWishlist(){

    if(!wishlist.length){

        alert(
            "Your wishlist is empty."
        );

        return;

    }


    const products =
        allProducts.filter(
            product =>
                wishlist.includes(
                    product.id
                )
        );


    const title =
        document.getElementById(
            "productTitle"
        );


    if(title){

        title.textContent =
            "My Wishlist";

    }


    renderProducts(
        products
    );


    const productsSection =
        document.getElementById(
            "products"
        );


    if(productsSection){

        productsSection.scrollIntoView({
            behavior:"smooth"
        });

    }

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id){

    const product =
        allProducts.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    /*
       If product exists in loaded
       products, save complete product.
    */

    if(product){

        const existing =
            cart.find(
                item =>
                    Number(item.id) ===
                    Number(id)
            );


        if(existing){

            existing.quantity =
                Number(
                    existing.quantity || 1
                ) + 1;


        }else{

            cart.push({

                id: product.id,

                name:
                    product.name ||
                    "Product",

                price:
                    Number(
                        product.price || 0
                    ),

                old_price:
                    Number(
                        product.old_price || 0
                    ),

                image_url:
                    product.image_url ||
                    "",

                category:
                    product.category ||
                    "",

                quantity:1,

                size:
                    product.size ||
                    null,

                color:
                    product.color ||
                    null

            });

        }


    }else{

        /*
           Fallback if product is not
           currently loaded.
        */

        const existing =
            cart.find(
                item =>
                    Number(item.id) ===
                    Number(id)
            );


        if(existing){

            existing.quantity =
                Number(
                    existing.quantity || 1
                ) + 1;

        }else{

            cart.push({

                id:id,

                quantity:1

            });

        }

    }


    saveCart();


    updateCounts();


    alert(
        "Product added to cart! 🛒"
    );

}


/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCounts(){

    const cartCount =
        document.getElementById(
            "cartCount"
        );


    const wishlistCount =
        document.getElementById(
            "wishlistCount"
        );


    const cartTotal =
        cart.reduce(
            function(sum,item){

                return sum +
                    Number(
                        item.quantity || 0
                    );

            },
            0
        );


    if(cartCount){

        cartCount.textContent =
            cartTotal;

    }


    if(wishlistCount){

        wishlistCount.textContent =
            wishlist.length;

    }

}


/* =====================================================
   GO TO CART
===================================================== */

function goCart(){

    /*
       IMPORTANT:
       Cart page is now connected.
    */

    saveCart();


    window.location.href =
        "cart.html";

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

const adminLink =
    document.getElementById(
        "adminLink"
    );


if(adminLink){

    adminLink.addEventListener(
        "click",
        async function(){

            try{

                const {
                    data,
                    error
                } =
                await supabaseClient
                    .auth
                    .getSession();


                if(error){

                    console.error(error);

                }


                if(
                    data &&
                    data.session
                ){

                    window.location.href =
                        "admin.html";

                    return;

                }


                const email =
                    prompt(
                        "Admin Email:"
                    );


                if(!email){

                    return;

                }


                const password =
                    prompt(
                        "Admin Password:"
                    );


                if(!password){

                    return;

                }


                const {
                    error:loginError
                } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email.trim(),

                        password:
                            password

                    });


                if(loginError){

                    alert(
                        "Login failed: " +
                        loginError.message
                    );

                    return;

                }


                window.location.href =
                    "admin.html";


            }catch(error){

                console.error(
                    error
                );


                alert(
                    "Something went wrong. Please try again."
                );

            }

        }
    );

}


/* =====================================================
   RATING STARS
===================================================== */

function ratingStars(
    rating
){

    const rounded =
        Math.round(
            Number(rating || 0)
        );


    let stars = "";


    for(
        let i = 1;
        i <= 5;
        i++
    ){

        stars +=
            i <= rounded
            ? "★"
            : "☆";

    }


    return stars;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>
